<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script src="done-sound.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5e0f17">
<title>Saatler Kitabı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Grenze+Gotisch:wght@500;700&family=UnifrakturMaguntia&display=swap" rel="stylesheet">
<style>
:root{
  --vellum:#f2e4c4;
  --vellum-hi:#faf1db;
  --ink:#2b1d12;
  --ink-soft:#5b4532;
  --ink-faint:rgba(43,29,18,.16);
  --rubric:#9a2b1b;            /* decorative red ink (muted vermilion) */
  --crimson:#8a1823;
  --crimson-deep:#5e0f17;
  --lapis:#1f3a78;
  --gold:#b8892a;
  --gold-hi:#f1d27a;
  --gold-lo:#7d5a14;
  --gold-leaf:linear-gradient(135deg,#7d5a14 0%,#e8c66a 22%,#b8892a 40%,#f6e19a 56%,#a67b22 76%,#e2bf5e 100%);
  --alarm:#d1001f;             /* overdue: saturated alarm red, distinct from rubric */
  --alarm-ink:#a8001a;
  --alarm-wash:rgba(209,0,31,.11);
  --bar-h:64px;
  --f-gothic:'Grenze Gotisch','EB Garamond',Georgia,serif;
  --f-fraktur:'UnifrakturMaguntia','Grenze Gotisch',Georgia,serif;
  --f-book:'EB Garamond','Cormorant Garamond',Georgia,'Times New Roman',serif;
  --parchment:
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .30  0 0 0 0 .14  0 0 0 .20 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='600' height='600'><filter id='b'><feTurbulence type='fractalNoise' baseFrequency='.012' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .38  0 0 0 0 .16  0 0 0 .55 -.18'/></filter><rect width='100%' height='100%' filter='url(%23b)'/></svg>"),
    radial-gradient(ellipse at 50% 40%, rgba(255,250,232,.65) 0%, rgba(255,250,232,0) 60%),
    radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 62%, rgba(110,70,20,.22) 100%);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:#2a0d10;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100vh;color:var(--ink);font-family:var(--f-book);font-size:17px;line-height:1.4;
  overflow-x:clip;
  background-color:#2a0d10;
  background-image:
    repeating-linear-gradient(45deg, rgba(184,137,42,.07) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(-45deg, rgba(184,137,42,.07) 0 1px, transparent 1px 22px),
    radial-gradient(ellipse at top, #4a1419, #1c0709 75%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lapis);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{
  max-width:430px;margin:0 auto;min-height:100vh;position:relative;
  background-color:var(--vellum);background-image:var(--parchment);
  box-shadow:0 0 0 1px #1a0507, 0 0 0 4px rgba(184,137,42,.35), 0 0 70px rgba(0,0,0,.7);
}

/* ---------- Masthead ---------- */
.masthead{padding:16px 14px 8px;text-align:center}
.crest-row{display:grid;grid-template-columns:44px 1fr 44px;align-items:end;gap:6px}
.shield{width:40px;height:46px;filter:drop-shadow(0 1.5px 1px rgba(60,30,10,.45))}
.rose{width:56px;height:56px;display:block;margin:0 auto 2px;filter:drop-shadow(0 1px 1px rgba(60,30,10,.4))}
.book-title{
  margin:0;font-family:var(--f-gothic);font-weight:700;font-size:clamp(32px,9.5vw,40px);line-height:1;
  color:var(--crimson);letter-spacing:.01em;text-shadow:0 1px 0 rgba(255,250,235,.7);
}
.book-title .init{
  font-family:var(--f-fraktur);font-weight:400;font-size:1.18em;
  background:var(--gold-leaf);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:none;filter:drop-shadow(0 1px 0 rgba(94,15,23,.55));
}
.anno{margin:4px 0 0;font-size:14px;font-style:italic;color:var(--rubric);letter-spacing:.06em}
.band{
  height:12px;margin:6px 0 0;
  background:
    radial-gradient(circle at 6px 6px, var(--gold) 1.8px, transparent 2.4px) 0 0/12px 12px repeat-x,
    linear-gradient(var(--crimson),var(--crimson)) 0 0/100% 2px no-repeat,
    linear-gradient(var(--crimson),var(--crimson)) 0 100%/100% 2px no-repeat;
}

/* ---------- Sticky week bar ---------- */
.weekbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:7px 8px;
  color:#f8eed4;
  background:
    repeating-linear-gradient(45deg, rgba(241,210,122,.06) 0 1px, transparent 1px 10px),
    linear-gradient(#94202b, var(--crimson-deep));
  border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);
  box-shadow:inset 0 1px 0 rgba(255,220,160,.25), 0 4px 12px rgba(40,10,10,.35);
}
.weekbar :focus-visible{outline-color:var(--gold-hi)}
.navbtn{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  border:1.5px solid var(--gold-hi);background:rgba(0,0,0,.2);color:var(--gold-hi);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.navbtn:active{background:rgba(0,0,0,.35)}
.navbtn svg{width:20px;height:20px}
.range{flex:1;min-width:0;text-align:center}
.range-main{font-weight:600;font-size:clamp(15px,4.5vw,18px);line-height:1.15;letter-spacing:.01em}
.range-sub{font-family:var(--f-gothic);font-weight:500;font-size:13.5px;line-height:1.2;color:var(--gold-hi);letter-spacing:.05em}
.todaybtn{
  flex:none;height:44px;padding:0 13px;border-radius:22px;cursor:pointer;
  background:var(--gold-leaf);color:var(--crimson-deep);font-weight:700;font-size:15.5px;letter-spacing:.02em;
  border:1px solid #4a3209;box-shadow:inset 0 1px 0 rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.35);
}
.todaybtn.is-current{filter:saturate(.75) brightness(.95)}
.todaybtn:active{filter:brightness(.9)}

/* ---------- Week / days ---------- */
.pages{overflow-x:clip;padding:12px 12px 8px;touch-action:pan-y}
.week{display:flex;flex-direction:column;gap:14px;-webkit-user-select:none;user-select:none}
.day{
  position:relative;padding:28px 10px 6px;border-radius:3px;
  background:rgba(255,249,232,.42);
  border:1px solid rgba(125,90,20,.42);
  box-shadow:inset 0 0 0 3px rgba(242,228,196,.85), inset 0 0 0 4px rgba(154,43,27,.30), 0 1px 0 rgba(255,255,255,.5);
  scroll-margin-top:calc(var(--bar-h) + 12px);
}
.arch{position:absolute;left:10px;right:10px;top:5px;height:22px;width:calc(100% - 20px);overflow:visible;pointer-events:none}
.arch path{fill:none;stroke:rgba(91,69,50,.38);stroke-width:1.2;vector-effect:non-scaling-stroke}
.arch path.inner{stroke-width:.8;stroke-dasharray:2 3}
.finial{position:absolute;top:-9px;left:50%;width:20px;height:20px;transform:translateX(-50%);pointer-events:none}
.day.today{
  background:rgba(255,246,212,.82);border-color:var(--gold);
  box-shadow:inset 0 0 0 3px #f9eecf, inset 0 0 0 5px var(--gold), 0 0 0 1px var(--gold-lo), 0 8px 22px rgba(125,90,20,.35);
}
.day.today .arch path{stroke:var(--gold);stroke-width:2}
.day.today .arch path.inner{stroke:var(--crimson);stroke-width:1;stroke-dasharray:none;opacity:.6}

.day-head{display:flex;align-items:center;gap:10px;min-height:54px}
.initial{
  flex:none;width:50px;height:50px;border-radius:3px;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle, rgba(255,255,255,.2) 1px, transparent 1.6px) 0 0/7px 7px, var(--lapis);
  box-shadow:0 0 0 2px var(--gold), 0 0 0 3px var(--gold-lo), inset 0 0 0 2px rgba(0,0,0,.25), 0 2px 4px rgba(50,25,5,.35);
}
.initial.rubeus{background:radial-gradient(circle, rgba(255,255,255,.18) 1px, transparent 1.6px) 0 0/7px 7px, var(--crimson)}
.initial span{
  font-family:var(--f-fraktur);font-size:38px;line-height:1;transform:translateY(1px);
  background:var(--gold-leaf);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 1px 0 rgba(0,0,0,.45));
}
.initial::after{ /* little ivy tendril trailing from the initial */
  content:"";position:absolute;left:50%;top:100%;width:2px;height:10px;margin-left:-1px;
  background:linear-gradient(var(--gold),rgba(184,137,42,0));
}
.day.today .initial{background:var(--gold-leaf);box-shadow:0 0 0 2px var(--crimson), 0 0 0 3px var(--gold-lo), inset 0 1px 0 rgba(255,255,255,.6), 0 3px 8px rgba(125,90,20,.45)}
.day.today .initial span{background:none;color:var(--crimson);filter:drop-shadow(0 1px 0 rgba(255,240,200,.8))}
.day.past .initial{filter:saturate(.7)}

.day-title{flex:1;min-width:0}
.dline{margin:0;line-height:1.15}
.dname{font-weight:700;font-size:21px;color:var(--ink);letter-spacing:.005em}
.ddate{font-size:17px;font-weight:500;color:var(--rubric);white-space:nowrap}
.today-tag{
  display:inline-block;margin-top:5px;padding:2px 15px 1px;font-weight:700;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;
  color:#fff6dc;background:var(--crimson);
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 50%,100% 100%,0 100%,8px 50%);
}
.add{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;
  background:radial-gradient(circle at 35% 30%, #b8323b, var(--crimson-deep) 75%);
  border:2px solid var(--gold);color:var(--gold-hi);
  box-shadow:0 2px 4px rgba(60,20,10,.35), inset 0 1px 0 rgba(255,255,255,.2);
}
.add:active{transform:scale(.94)}
.add svg{width:20px;height:20px}

.late-summary{
  display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:10px 0 2px;padding:6px 12px;cursor:pointer;text-align:left;
  background:#fff1ee;border:1.5px solid var(--alarm);border-radius:6px;color:var(--alarm-ink);font-weight:700;font-size:16.5px;
  box-shadow:0 1px 0 rgba(255,255,255,.6);
}
.late-summary svg{flex:none;width:20px;height:20px}
.late-summary .go{margin-left:auto;font-weight:600;font-size:14.5px;opacity:.85}

.tasks{list-style:none;margin:8px 0 0;padding:0}
.task{display:flex;align-items:stretch;border-top:1px solid var(--ink-faint);position:relative}
.task:last-child{border-bottom:1px solid var(--ink-faint)}
.seal{flex:none;width:44px;min-height:46px;padding:0;border:0;background:none;cursor:pointer;display:grid;place-items:center;color:rgba(91,69,50,.75)}
.seal svg{width:31px;height:31px;overflow:visible}
.task-body{
  flex:1;min-width:0;min-height:46px;display:flex;align-items:center;gap:6px;padding:7px 4px 7px 2px;
  border:0;background:none;text-align:left;cursor:pointer;
}
.time{flex:none;min-width:46px;font-size:15.5px;font-weight:600;color:var(--rubric);font-variant-numeric:lining-nums tabular-nums}
.pilcrow{flex:none;min-width:46px;font-size:19px;line-height:1;color:var(--rubric)}
.title{flex:1;min-width:0;font-size:18px;line-height:1.28;overflow-wrap:anywhere;color:var(--ink)}
.task.done .title{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:rgba(43,29,18,.8);color:var(--ink-soft)}
.task.done .time,.task.done .pilcrow{opacity:.55}
.task.overdue{background:linear-gradient(90deg,var(--alarm-wash),rgba(209,0,31,.025));box-shadow:inset 4px 0 0 var(--alarm)}
.task.overdue .seal{color:var(--alarm)}
.task.overdue .title{color:var(--alarm-ink);font-weight:600}
.task.overdue .time,.task.overdue .pilcrow{color:var(--alarm-ink)}
.late{
  flex:none;display:inline-flex;align-items:center;gap:3px;padding:2px 8px 2px 5px;border-radius:10px;
  background:var(--alarm);color:#fff;font-size:12.5px;font-weight:700;letter-spacing:.03em;line-height:1.3;
}
.late svg{width:12px;height:12px}
.empty{
  margin:8px 0 2px;padding:10px 6px 8px;text-align:center;font-style:italic;font-size:16px;color:var(--ink-soft);
  border-top:1px solid var(--ink-faint);
}
.empty .orn{font-style:normal;color:var(--rubric);margin:0 6px}

.task.stamp .seal svg{animation:stamp .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes stamp{0%{transform:scale(1.9) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
.task.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%,30%{background-color:rgba(241,210,122,.75)}100%{background-color:transparent}}

.colophon{text-align:center;padding:6px 16px 34px;color:var(--ink-soft);font-size:14.5px;font-style:italic}
.colophon .orn{color:var(--rubric);font-style:normal;margin:0 6px}
.colophon .warn{display:block;margin-top:4px;color:var(--alarm-ink);font-style:normal}

/* ---------- Sheets ---------- */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(25,8,6,.58);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:50%;bottom:0;z-index:60;width:100%;max-width:430px;
  transform:translate(-50%,105%);visibility:hidden;
  transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s linear .3s;
  background-color:var(--vellum-hi);background-image:var(--parchment);
  border-top:3px solid var(--gold);border-radius:18px 18px 0 0;
  box-shadow:0 -1px 0 var(--gold-lo), 0 -10px 40px rgba(0,0,0,.45);
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));
}
.sheet.open{transform:translate(-50%,0);visibility:visible;transition:transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s}
.grab{width:46px;height:5px;border-radius:3px;background:rgba(91,69,50,.35);margin:2px auto 10px}
.sheet-title{margin:0;font-family:var(--f-gothic);font-weight:700;font-size:30px;line-height:1.05;color:var(--crimson);text-align:center}
.sheet-orn{display:block;width:120px;height:12px;margin:6px auto 8px}
.sheet-day{margin:0 0 12px;text-align:center;font-size:16.5px;color:var(--ink-soft)}
.sheet-day strong{color:var(--rubric);font-weight:700}
.field{display:block;margin:0 0 12px}
.field>span{display:block;font-size:15px;font-weight:600;color:var(--ink-soft);margin:0 0 4px;letter-spacing:.02em}
.field em{font-weight:400}
.field input{
  width:100%;min-height:48px;padding:10px 12px;font:inherit;font-size:18px;color:var(--ink);
  background:rgba(255,252,240,.85);border:1px solid rgba(125,90,20,.5);border-bottom:2px solid var(--rubric);border-radius:4px;
}
.field input:focus{outline:2px solid var(--gold);outline-offset:1px}
.field input.invalid{border-color:var(--alarm);border-bottom-color:var(--alarm);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.err{margin:-6px 0 10px;color:var(--alarm-ink);font-size:15px;font-weight:600}
.del-quote{margin:4px 0 16px;text-align:center;font-size:19px;font-style:italic;color:var(--ink);overflow-wrap:anywhere}
.del-quote small{display:block;font-style:normal;font-size:15px;color:var(--rubric);margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.btn{min-height:50px;border-radius:8px;font-size:18px;font-weight:700;cursor:pointer;letter-spacing:.02em}
.btn.ghost{background:rgba(255,252,240,.7);border:1.5px solid rgba(91,69,50,.55);color:var(--ink)}
.btn.primary{background:radial-gradient(circle at 40% 25%, #a8252f, var(--crimson-deep));border:2px solid var(--gold);color:#fff3d6;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 2px 5px rgba(60,20,10,.3)}
.btn.danger{background:var(--alarm);border:2px solid #7a0012;color:#fff;box-shadow:0 2px 5px rgba(120,0,15,.3)}
.btn:active{transform:translateY(1px)}

.sprite{position:absolute;width:0;height:0;overflow:hidden}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

  </defs>
</svg>

<div class="app">
  <header class="masthead">
    <div class="crest-row">
      <!-- crimson field, white crowned eagle (generic) -->
      <svg class="shield" viewBox="0 0 40 46" aria-hidden="true">
        <path d="M2 2 H38 V20 C38 34 20 44 20 44 C20 44 2 34 2 20 Z" fill="#9b1b26" stroke="url(#goldG)" stroke-width="2.2"/>
        <g fill="#f6f0e4">
          <path d="M17 16 L6 12 L8 16 L5 18 L9 20 L6.5 23 L11 24 L17 22 Z"/>
          <path d="M23 16 L34 12 L32 16 L35 18 L31 20 L33.5 23 L29 24 L23 22 Z"/>
          <path d="M17 15 Q20 13 23 15 L22.5 27 Q20 29 17.5 27 Z"/>
          <path d="M18 27 L15 34 L20 31 L25 34 L22 27 Z"/>
          <circle cx="20" cy="12.2" r="3"/>
        </g>
        <path d="M17.5 9.3 L17.5 7 L18.8 8.1 L20 6.2 L21.2 8.1 L22.5 7 L22.5 9.3 Z" fill="#f1d27a"/>
        <path d="M22.6 12 L24.6 12.8 L22.6 13.4 Z" fill="#f1d27a"/>
      </svg>

      <div class="title-block">
        <!-- rose window -->

<script>
(function () {
  'use strict';

  var KEY = 'todoapp.tasks.v1';
  var DAY_NAMES = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];
  var MONTHS = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
  var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var $ = function (s) { return document.querySelector(s); };

  /* ---------- Local-date helpers (no UTC) ---------- */
  function pad(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function parseYmd(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function startOfWeek(d) { return addDays(d, -((d.getDay() + 6) % 7)); }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
  function sameDay(a, b) { return ymd(a) === ymd(b); }

  function roman(num) {
    var map = [[1000, 'M'], [900, 'CM'], [500, 'D'], [400, 'CD'], [100, 'C'], [90, 'XC'], [50, 'L'], [40, 'XL'], [10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']];
    var out = '';
    map.forEach(function (m) { while (num >= m[0]) { out += m[1]; num -= m[0]; } });
    return out;
  }
  function isoWeek(weekStart) {
    var thu = addDays(weekStart, 3);
    var w1 = startOfWeek(new Date(thu.getFullYear(), 0, 4));
    return 1 + Math.round((weekStart - w1) / (7 * 864e5));
  }
  function formatRange(ws) {
    var we = addDays(ws, 6);
    if (ws.getFullYear() !== we.getFullYear()) {
      return ws.getDate() + ' ' + MONTHS[ws.getMonth()] + ' ' + ws.getFullYear() + ' – ' + we.getDate() + ' ' + MONTHS[we.getMonth()] + ' ' + we.getFullYear();
    }
    if (ws.getMonth() !== we.getMonth()) {
      return ws.getDate() + ' ' + MONTHS[ws.getMonth()] + ' – ' + we.getDate() + ' ' + MONTHS[we.getMonth()] + ' ' + we.getFullYear();
    }
    return ws.getDate() + ' – ' + we.getDate() + ' ' + MONTHS[we.getMonth()] + ' ' + we.getFullYear();
  }
  function dayLabel(ds) {
    var d = parseYmd(ds);
    return DAY_NAMES[(d.getDay() + 6) % 7] + ' · ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  /* ---------- Storage ---------- */
  var storageOk = true;
  var TIME_RE = /^([01]\d|2[0-3]):[0-5]\d$/;
  var DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

  function normalize(t) {
    return Object.assign({}, t, {
      id: String(t.id),
      title: String(t.title == null ? '' : t.title),
      date: t.date,
      time: (typeof t.time === 'string' && TIME_RE.test(t.time)) ? t.time : null,
      done: !!t.done,
      createdAt: typeof t.createdAt === 'number' ? t.createdAt : 0,
      categoryId: t.categoryId === undefined ? null : t.categoryId,
      recurrenceId: t.recurrenceId === undefined ? null : t.recurrenceId
    });
  }
  function isValid(t) { return t && typeof t === 'object' && t.id != null && typeof t.date === 'string' && DATE_RE.test(t.date); }

  function load() {
    var raw;
    try { raw = localStorage.getItem(KEY); }
    catch (e) { storageOk = false; return seed(); }
    if (raw === null) { var s = seed(); save(s); return s; }
    try {
      var arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr.filter(isValid).map(normalize) : [];
    } catch (e) { return []; }
  }
  function save(list) {
    try { localStorage.setItem(KEY, JSON.stringify(list || state.tasks)); }
    catch (e) { storageOk = false; }
  }

  function seed() {
    var t = today(), ws = startOfWeek(t), ti = (t.getDay() + 6) % 7, now = Date.now(), n = 0;
    function day(i) { return addDays(ws, i); }
    function mk(date, title, time, done) {
      n++;
      return { id: 'seed' + n + '-' + now.toString(36), title: title, date: ymd(date), time: time || null,
        done: !!done, createdAt: now - 100000 + n * 1000, categoryId: null, recurrenceId: null };
    }
    var doneDay = ti >= 1 ? day(0) : day(-3);   // earlier this week (last week if today is Monday)
    var lateDay = ti >= 1 ? day(ti - 1) : day(-2);
    var out = [
      mk(day(-5), 'Diş hekiminden randevu al', '10:30', false), // overdue, last week
      mk(doneDay, 'Market alışverişi', '11:00', true),
      mk(doneDay, 'Çamaşırları yıka', null, true),
      mk(lateDay, 'Fatura öde', '09:00', false),               // overdue
      mk(t, 'Sabah yürüyüşü', '07:30', true),
      mk(t, 'Spor', '18:00', false),
      mk(t, 'Annemi ara', null, false),
      mk(t, 'Kitap oku 30 dk', null, false)
    ];
    var fut = [ti + 1, ti + 2, ti + 4].filter(function (i) { return i <= 6; });
    if (!fut.length) fut = [7, 8];
    var futT = [['Toplantı notlarını hazırla', '14:00'], ['Kütüphaneye kitap iade et', null], ['Doğum günü hediyesi al', '17:30']];
    fut.forEach(function (i, k) { out.push(mk(day(i), futT[k][0], futT[k][1], false)); });
    return out;
  }

  /* ---------- State ---------- */
  var state = {
    weekStart: startOfWeek(today()),
    tasks: [],
    addDate: null,
    delId: null,
    stampId: null
  };
  state.tasks = load();

  function cmpTasks(a, b) {
    if (a.time && b.time) return a.time < b.time ? -1 : a.time > b.time ? 1 : a.createdAt - b.createdAt;
    if (a.time) return -1;
    if (b.time) return 1;
    return a.createdAt - b.createdAt;
  }
  function isOverdue(t, todayStr) { return !t.done && t.date < todayStr; }
  function findTask(id) { for (var i = 0; i < state.tasks.length; i++) if (state.tasks[i].id === id) return state.tasks[i]; return null; }
  function sealTilt(id) { var h = 0; for (var i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) | 0; return (Math.abs(h) % 41) - 20; }

  /* ---------- Rendering ---------- */
  var weekEl = $('#week'), pagesEl = $('#pages'), weekbar = $('#weekbar');

  var ARCH = '<svg class="arch" viewBox="0 0 300 22" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="M0 22 C70 21 122 13 150 1 C178 13 230 21 300 22"/>' +
    '<path class="inner" d="M18 22 C80 21 128 15 150 7 C172 15 220 21 282 22"/></svg>';
  var FINIAL = '<svg class="finial" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-cross" fill="#b8892a" style="color:#b8892a"/></svg>';

  function taskHtml(t, todayStr) {
    var over = isOverdue(t, todayStr);
    var cls = 'task' + (t.done ? ' done' : '') + (over ? ' overdue' : '') + (state.stampId === t.id ? ' stamp' : '');
    var mark = t.done
      ? '<svg viewBox="0 0 40 40" style="transform:rotate(' + sealTilt(t.id) + 'deg)"><use href="#i-seal"/></svg>'
      : '<svg viewBox="0 0 40 40"><use href="#i-ring"/></svg>';
    var lead = t.time
      ? '<span class="time">' + esc(t.time) + '</span>'
      : '<span class="pilcrow" aria-hidden="true">¶</span>';
    var badge = over ? '<span class="late"><svg aria-hidden="true"><use href="#i-alarm"/></svg>Gecikti</span>' : '';
    return '<li class="' + cls + '" data-id="' + esc(t.id) + '">' +
      '<button type="button" class="seal" role="checkbox" aria-checked="' + (t.done ? 'true' : 'false') + '" aria-label="Tamamlandı: ' + esc(t.title) + '">' + mark + '</button>' +
      '<button type="button" class="task-body" aria-haspopup="dialog">' + lead +
      '<span class="title">' + esc(t.title) + '</span>' + badge + '</button></li>';
  }

  function render() {
    var t = today(), todayStr = ymd(t);
    var ws = state.weekStart;
    var isCurrent = sameDay(ws, startOfWeek(t));

    $('#rangeMain').textContent = formatRange(ws);
    $('#rangeSub').textContent = roman(isoWeek(ws)) + '. Hafta';
    $('#todayBtn').classList.toggle('is-current', isCurrent);
    $('#annoYear').textContent = roman(t.getFullYear());

    var overdueCount = state.tasks.filter(function (x) { return isOverdue(x, todayStr); }).length;
    var html = '';
    for (var i = 0; i < 7; i++) {
      var d = addDays(ws, i), ds = ymd(d);
      var isToday = ds === todayStr, isPast = ds < todayStr;
      var list = state.tasks.filter(function (x) { return x.date === ds; }).sort(cmpTasks);
      html += '<section class="day' + (isToday ? ' today' : '') + (isPast ? ' past' : '') + '" id="day-' + ds + '" data-date="' + ds + '"' +
        (isToday ? ' aria-current="date"' : '') + ' aria-label="' + DAY_NAMES[i] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '">' +
        ARCH + (isToday ? FINIAL : '') +
        '<div class="day-head">' +
          '<div class="initial' + (i % 2 ? ' rubeus' : '') + '" aria-hidden="true"><span>' + DAY_NAMES[i].charAt(0) + '</span></div>' +
          '<div class="day-title"><p class="dline"><span class="dname">' + DAY_NAMES[i] + '</span> <span class="ddate">· ' + d.getDate() + ' ' + MONTHS[d.getMonth()] + '</span></p>' +
            (isToday ? '<span class="today-tag">Bugün</span>' : '') + '</div>' +
          '<button type="button" class="add" data-date="' + ds + '" aria-label="' + DAY_NAMES[i] + ' gününe görev ekle"><svg aria-hidden="true"><use href="#i-cross"/></svg></button>' +
        '</div>';
      if (isToday && isCurrent && overdueCount > 0) {
        html += '<button type="button" class="late-summary"><svg aria-hidden="true"><use href="#i-alarm"/></svg>' +
          overdueCount + ' geciken görev<span class="go">Göster ›</span></button>';
      }
      if (list.length) {
        html += '<ul class="tasks">' + list.map(function (x) { return taskHtml(x, todayStr); }).join('') + '</ul>';
      } else {
        html += '<p class="empty"><span class="orn" aria-hidden="true">❦</span>Görev yok<span class="orn" aria-hidden="true">❦</span></p>';
      }
      html += '</section>';
    }
    weekEl.innerHTML = html;
    state.stampId = null;
    $('#storageWarn').hidden = storageOk;
  }

  function measureBar() {
    document.documentElement.style.setProperty('--bar-h', weekbar.offsetHeight + 'px');
  }

  function scrollToToday(smooth) {
    var el = document.getElementById('day-' + ymd(today()));
    if (el) el.scrollIntoView({ block: 'start', behavior: smooth && !reduced ? 'smooth' : 'auto' });
  }
  function scrollToWeekTop() {
    var top = pagesEl.getBoundingClientRect().top + window.scrollY - weekbar.offsetHeight;
    if (window.scrollY > top) window.scrollTo({ top: top, behavior: reduced ? 'auto' : 'smooth' });
  }
  function rowEl(id) { return weekEl.querySelector('.task[data-id="' + CSS.escape(id) + '"]'); }
  function flashRow(id, scroll) {
    var el = rowEl(id);
    if (!el) return;
    if (scroll) el.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  /* ---------- Week navigation with slide ---------- */
  var animating = false;
  function slide(dir, cb) {
    if (reduced) { weekEl.style.transform = ''; weekEl.style.opacity = ''; cb(); return; }
    animating = true;
    weekEl.style.transition = 'transform .18s ease-in, opacity .18s ease-in';
    weekEl.style.transform = 'translateX(' + (-dir * 60) + '%)';
    weekEl.style.opacity = '0';
    setTimeout(function () {
      cb();
      weekEl.style.transition = 'none';
      weekEl.style.transform = 'translateX(' + (dir * 40) + '%)';
      void weekEl.offsetWidth;
      weekEl.style.transition = 'transform .28s cubic-bezier(.2,.8,.2,1), opacity .28s ease-out';
      weekEl.style.transform = '';
      weekEl.style.opacity = '';
      setTimeout(function () { weekEl.style.transition = ''; animating = false; }, 300);
    }, 180);
  }
  function goToWeek(ws, after) {
    var diff = Math.round((ws - state.weekStart) / (7 * 864e5));
    if (diff === 0) { if (after) after(); return; }
    state.weekStart = ws;
    slide(diff > 0 ? 1 : -1, function () {
      render();
      if (after) after();
      else if (sameDay(ws, startOfWeek(today()))) scrollToToday(true);
      else scrollToWeekTop();
    });
  }
  function changeWeek(delta) { goToWeek(addDays(state.weekStart, 7 * delta)); }

  $('#prevBtn').addEventListener('click', function () { if (!animating) changeWeek(-1); });
  $('#nextBtn').addEventListener('click', function () { if (!animating) changeWeek(1); });
  $('#todayBtn').addEventListener('click', function () {
    if (animating) return;
    var ws = startOfWeek(today());
    if (sameDay(ws, state.weekStart)) { render(); scrollToToday(true); }
    else goToWeek(ws);
  });

  /* ---------- Swipe (pointer drag) ---------- */
  var sw = null, suppressClick = false;
  pagesEl.addEventListener('pointerdown', function (e) {
    if (animating || (e.pointerType === 'mouse' && e.button !== 0)) return;
    sw = { x: e.clientX, y: e.clientY, id: e.pointerId, active: false, dx: 0 };
  });
  pagesEl.addEventListener('pointermove', function (e) {
    if (!sw || e.pointerId !== sw.id) return;
    var dx = e.clientX - sw.x, dy = e.clientY - sw.y;
    if (!sw.active) {
      if (Math.abs(dx) > 14 && Math.abs(dx) > Math.abs(dy) * 1.4) {
        sw.active = true;
        try { pagesEl.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      } else if (Math.abs(dy) > 14) { sw = null; return; }
      else return;
    }
    sw.dx = dx;
    if (!reduced) {
      weekEl.style.transition = 'none';
      weekEl.style.transform = 'translateX(' + (dx * 0.55) + 'px)';
      weekEl.style.opacity = String(1 - Math.min(Math.abs(dx) / 600, 0.4));
    }
    e.preventDefault();
  });
  function endSwipe(cancel) {
    if (!sw) return;
    var s = sw; sw = null;
    if (!s.active) return;
    suppressClick = true;
    setTimeout(function () { suppressClick = false; }, 60);
    if (!cancel && Math.abs(s.dx) > 60) {
      changeWeek(s.dx < 0 ? 1 : -1);
    } else {
      weekEl.style.transition = 'transform .22s ease-out, opacity .22s ease-out';
      weekEl.style.transform = '';
      weekEl.style.opacity = '';
    }
  }
  pagesEl.addEventListener('pointerup', function () { endSwipe(false); });
  pagesEl.addEventListener('pointercancel', function () { endSwipe(true); });
  pagesEl.addEventListener('click', function (e) {
    if (suppressClick) { e.stopPropagation(); e.preventDefault(); }
  }, true);

  /* ---------- Task interactions ---------- */
  weekEl.addEventListener('click', function (e) {
    var add = e.target.closest('.add');
    if (add) { openAdd(add.getAttribute('data-date'), add); return; }
    if (e.target.closest('.late-summary')) { goToOverdue(); return; }
    var li = e.target.closest('.task');
    if (!li) return;
    var id = li.getAttribute('data-id');
    if (e.target.closest('.seal')) { toggle(id); return; }
    if (e.target.closest('.task-body')) { openDelete(id, e.target.closest('.task-body')); }
  });

  function toggle(id) {
    var t = findTask(id);
    if (!t) return;
    t.done = !t.done;
    save();
    state.stampId = t.done ? id : null;
    render();
    var el = rowEl(id);
    if (el) el.querySelector('.seal').focus({ preventScroll: true });
  }

  function goToOverdue() {
    var todayStr = ymd(today());
    var list = state.tasks.filter(function (x) { return isOverdue(x, todayStr); })
      .sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : cmpTasks(a, b); });
    if (!list.length) return;
    var first = list[0];
    var ws = startOfWeek(parseYmd(first.date));
    if (sameDay(ws, state.weekStart)) flashRow(first.id, true);
    else goToWeek(ws, function () { flashRow(first.id, true); });
  }

  /* ---------- Sheets ---------- */
  var backdrop = $('#backdrop'), addSheet = $('#addSheet'), delSheet = $('#delSheet');
  var addTitle = $('#addTitle'), addTime = $('#addTime'), addErr = $('#addErr');
  var openSheetEl = null, returnFocus = null;

  function openSheet(sheet, opener) {
    returnFocus = opener || document.activeElement;
    openSheetEl = sheet;
    sheet.removeAttribute('inert');
    sheet.classList.add('open');
    backdrop.classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    if (!openSheetEl) return;
    openSheetEl.classList.remove('open');
    openSheetEl.setAttribute('inert', '');
    openSheetEl = null;
    backdrop.classList.remove('open');
    document.body.style.overflow = '';
    if (returnFocus && document.contains(returnFocus)) { try { returnFocus.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
    returnFocus = null;
  }
  backdrop.addEventListener('click', closeSheet);
  document.querySelectorAll('[data-close]').forEach(function (b) { b.addEventListener('click', closeSheet); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && openSheetEl) closeSheet(); });

  function openAdd(ds, opener) {
    state.addDate = ds;
    $('#addDay').textContent = dayLabel(ds);
    addTitle.value = '';
    addTime.value = '';
    addTitle.classList.remove('invalid');
    addErr.hidden = true;
    openSheet(addSheet, opener);
    addTitle.focus();
    requestAnimationFrame(function () { if (document.activeElement !== addTitle) addTitle.focus(); });
  }

  $('#addForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var title = addTitle.value.trim();
    if (!title) {
      addTitle.classList.remove('invalid'); void addTitle.offsetWidth; addTitle.classList.add('invalid');
      addErr.hidden = false;
      addTitle.focus();
      return;
    }
    var tv = (addTime.value || '').slice(0, 5);
    var task = {
      id: newId(), title: title, date: state.addDate, time: TIME_RE.test(tv) ? tv : null,
      done: false, createdAt: Date.now(), categoryId: null, recurrenceId: null
    };
    state.tasks.push(task);
    save();
    returnFocus = null;
    closeSheet();
    render();
    flashRow(task.id, false);
    var el = rowEl(task.id);
    if (el) {
      var r = el.getBoundingClientRect();
      if (r.top < weekbar.offsetHeight || r.bottom > window.innerHeight) el.scrollIntoView({ block: 'center', behavior: reduced ? 'auto' : 'smooth' });
    }
  });
  addTitle.addEventListener('input', function () {
    if (addTitle.value.trim()) { addErr.hidden = true; addTitle.classList.remove('invalid'); }
  });

  function openDelete(id, opener) {
    var t = findTask(id);
    if (!t) return;
    state.delId = id;
    $('#delQuote').innerHTML = '“' + esc(t.title) + '”<small>' + esc(dayLabel(t.date)) + (t.time ? ' · ' + esc(t.time) : '') + '</small>';
    openSheet(delSheet, opener);
    $('#delConfirm').focus();
  }
  $('#delConfirm').addEventListener('click', function () {
    var id = state.delId;
    state.tasks = state.tasks.filter(function (x) { return x.id !== id; });
    save();
    state.delId = null;
    returnFocus = null;
    closeSheet();
    render();
  });

  /* ---------- Wax seal outline (irregular blob) ---------- */
  (function buildWax() {
    var N = 96, d = '';
    for (var i = 0; i <= N; i++) {
      var a = (i / N) * Math.PI * 2;
      var r = 15.2 + Math.sin(a * 7) * 0.9 + Math.sin(a * 3 + 1) * 0.7 + Math.sin(a * 11 + 2) * 0.35;
      d += (i ? 'L' : 'M') + (20 + Math.cos(a) * r).toFixed(2) + ' ' + (20 + Math.sin(a) * r).toFixed(2);
    }
    document.getElementById('waxBlob').setAttribute('d', d + 'Z');
  })();

  /* ---------- Init ---------- */
  render();
  measureBar();
  scrollToToday(false);
  var userScrolled = false;
  ['wheel', 'touchstart', 'keydown'].forEach(function (ev) {
    window.addEventListener(ev, function () { userScrolled = true; }, { once: true, passive: true });
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () {
      measureBar();
      if (!userScrolled && sameDay(state.weekStart, startOfWeek(today()))) scrollToToday(false);
    });
  }
  window.addEventListener('resize', measureBar);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !openSheetEl) render(); });
})();
</script>
</body>
</html>
